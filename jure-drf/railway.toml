[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

# Do NOT set startCommand here — Dockerfile ENTRYPOINT already runs
# docker-entrypoint.sh. A railway startCommand would be passed as args
# to ENTRYPOINT and break boot.

[deploy]
# Migrate here, not in the web process. The healthcheck hits /health/ as soon
# as the container starts; a migrate that hangs never opens that port.
preDeployCommand = "python manage.py migrate --noinput"
healthcheckPath = "/health/"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
