<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin:8px 0 0 0;">
  <tr>
    <td style="padding:14px 18px;font-family:Inter,Arial,Helvetica,sans-serif;{% if not last %}border-bottom:1px solid #E8E6ED;{% endif %}">
      <div style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#667085;font-weight:600;">{{ label }}</div>
      {% if primary %}
      <div style="margin-top:6px;font-size:15px;line-height:1.5;font-weight:600;color:#17141F;word-break:break-word;">{{ primary }}</div>
      {% endif %}
      {% if secondary %}
      <div style="margin-top:4px;font-size:14px;line-height:1.5;color:#667085;word-break:break-word;">
        {% if secondary_href %}
        <a href="{{ secondary_href }}" style="color:#64499D;text-decoration:none;">{{ secondary }}</a>
        {% else %}
        {{ secondary }}
        {% endif %}
      </div>
      {% endif %}
    </td>
  </tr>
</table>
